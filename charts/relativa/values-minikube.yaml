image:
  registry: ghcr.io/totalbyte
  tag: "1.2.0"
  pullPolicy: IfNotPresent

secrets:
  existingSecret: relativa-secrets

backup:
  enabled: false

ingress:
  enabled: false

gateway:
  replicaCount: 5
  progressDeadlineSeconds: 60
  image:
    tag: "1.4.0"
  rollout:
    enabled: true
    strategy:
      canary:
        maxSurge: 1
        maxUnavailable: 0
        steps:
          - setWeight: 20
          - pause: {}
          - setWeight: 60
          - pause: {duration: 30s}
          - setWeight: 80
          - pause: {duration: 30s}

auth:
  replicaCount: 1

core:
  replicaCount: 1

graph:
  replicaCount: 1

audit:
  replicaCount: 1

ml:
  replicaCount: 1

client:
  replicaCount: 1
