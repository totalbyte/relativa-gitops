apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relativa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/totalbyte/relativa-gitops.git
    targetRevision: main
    path: charts/relativa
    helm:
      valueFiles:
        - values-minikube.yaml
      skipTests: true
  destination:
    server: https://kubernetes.default.svc
    namespace: antoniuk
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
